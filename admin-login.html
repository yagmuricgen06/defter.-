<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş — defter yönetici</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FBF3E7;
    --paper-card: #FEFAF3;
    --ink: #3A2E27;
    --ink-soft: #6B5D51;
    --rust: #B5541A;
    --rust-deep: #8F3F12;
    --pine: #2F6F62;
    --tan-line: #DCC7A3;
    --coffee: #4A3728;
    --shadow: rgba(58,46,39,0.16);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--coffee);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(181,84,26,0.18), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(47,111,98,0.14), transparent 45%);
    font-family:'JetBrains Mono', monospace;
    color:var(--ink);
    padding:20px;
  }
  .card{
    background:var(--paper-card);
    border-radius:8px;
    padding:44px 40px 36px;
    width:100%;
    max-width:380px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
    border:1px solid var(--tan-line);
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:5px;
    background:linear-gradient(90deg, var(--rust), var(--pine));
    border-radius:8px 8px 0 0;
  }
  .logo{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:1.5rem;
    text-align:center;
    margin-bottom:6px;
    letter-spacing:-0.01em;
  }
  .logo .dot{ color:var(--rust); }
  .sub{
    text-align:center;
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:32px;
  }
  label{
    display:block;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .field{ margin-bottom:20px; }
  input{
    width:100%;
    font-family:'JetBrains Mono', monospace;
    font-size:0.92rem;
    padding:13px 14px;
    border:1px solid var(--tan-line);
    border-radius:4px;
    background:var(--paper);
    color:var(--ink);
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  input:focus-visible{
    border-color:var(--pine);
    box-shadow:0 0 0 3px rgba(47,111,98,0.15);
  }
  .btn{
    width:100%;
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    font-size:0.88rem;
    padding:13px;
    background:var(--rust);
    color:var(--paper-card);
    border:none;
    border-radius:4px;
    cursor:pointer;
    margin-top:8px;
    transition:background .2s ease, transform .15s ease;
  }
  .btn:hover{ background:var(--rust-deep); }
  .btn:active{ transform:scale(0.98); }
  .btn:focus-visible{ outline:2px solid var(--pine); outline-offset:2px; }
  .hint{
    text-align:center;
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-top:22px;
  }
  .hint a{ color:var(--pine); text-decoration:none; }
  .hint a:hover{ text-decoration:underline; }
  .demo-note{
    margin-top:18px;
    background:rgba(47,111,98,0.08);
    border:1px dashed var(--pine);
    border-radius:4px;
    padding:10px 12px;
    font-size:0.7rem;
    color:var(--ink-soft);
    line-height:1.5;
    text-align:center;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="logo">defter<span class="dot">.</span></div>
    <p class="sub">yönetici paneline giriş</p>

    <form id="login-form">
      <div class="field">
        <label for="user">kullanıcı adı</label>
        <input id="user" type="text" placeholder="admin@site.local" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="pass">şifre</label>
        <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit">giriş yap →</button>
    </form>

    <p class="hint"><a href="index.html">← bloga geri dön</a></p>

    <div class="demo-note">Geliştirme hesabı: admin@site.local · admin123!</div>
  </div>

  <script>
    const API = 'http://localhost:3000/api';
    document.querySelector('#login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = event.currentTarget.querySelector('button');
      button.disabled = true; button.textContent = 'giriş yapılıyor…';
      try {
        const response = await fetch(`${API}/auth/login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email: user.value, password: pass.value }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        sessionStorage.setItem('defterToken', data.token);
        window.location.href = 'admin.html';
      } catch (error) { alert(error.message || 'Giriş yapılamadı.'); }
      finally { button.disabled = false; button.textContent = 'giriş yap →'; }
    });
  </script>

</body>
</html>
